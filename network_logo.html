<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Propagation mark</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&amp;family=Montserrat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
.fc{fill:var(--c,#F04A2B)} .fv{fill:var(--v,#5534E0)} .fw{fill:#fff}
.sc{stroke:var(--c,#F04A2B)} .sv{stroke:var(--v,#5534E0)}
.rim{fill:none;stroke-width:2px;stroke-linejoin:round;opacity:.45}
.orbit{fill:none;stroke-width:3px;stroke-linecap:round;stroke-dasharray:4 14;animation:orbit calc(var(--k,1) * 2.2s) linear infinite}
@keyframes orbit{to{stroke-dashoffset:-18}}
.spoke{stroke-width:2.5px;stroke-linecap:round}
.icw{fill:none;stroke:#fff;stroke-width:2.2px;stroke-linecap:round;stroke-linejoin:round}
.br{transform-box:fill-box;transform-origin:center;animation:br calc(var(--k,1) * 3.2s) ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){.mark *{animation:none !important}}
</style>
</helmet>
<div style="width:520px;height:560px;box-sizing:border-box;padding:44px 40px 40px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:{{bg}};--k:{{k}};--c:{{coral}};--v:{{violet}};--bg:{{bg}}">
<svg class="mark" viewBox="0 0 400 400" width="360" height="360" role="img" aria-label="A network with scales of justice at its hub, linked to nodes for conversation, broadcast, technology and place">
<path class="rim sv" d="M 106,100 L 298,104 M 104,298 L 300,296"></path>
<path class="rim sv" d="M 200,72 L 298,104 L 336,198 L 300,296 L 204,334 L 104,298 L 66,196 L 106,100 Z"></path>
<path class="orbit sv" d="M 200,72 L 298,104 L 336,198 L 300,296 L 204,334 L 104,298 L 66,196 L 106,100 Z"></path>
<path class="spoke sc" d="M 200,200 L 200,72 M 200,200 L 298,104 M 200,200 L 336,198 M 200,200 L 300,296 M 200,200 L 204,334 M 200,200 L 104,298 M 200,200 L 66,196 M 200,200 L 106,100"></path>
<circle class="br fc" style="animation-delay:calc(var(--k,1) * -0.4s)" cx="298" cy="104" r="11"></circle>
<circle class="br fc" style="animation-delay:calc(var(--k,1) * -1.2s)" cx="300" cy="296" r="11"></circle>
<circle class="br fc" style="animation-delay:calc(var(--k,1) * -2s)" cx="104" cy="298" r="11"></circle>
<circle class="br fc" style="animation-delay:calc(var(--k,1) * -2.8s)" cx="106" cy="100" r="11"></circle>
<g class="br"><circle class="fv" cx="200" cy="72" r="23"></circle>
<path class="icw" d="M 189,63 H 211 V 77 H 199 L 194,82 V 77 H 189 Z M 194,73 L 198,68 L 202,72 L 206,67"></path></g>
<g class="br" style="animation-delay:calc(var(--k,1) * -0.8s)"><circle class="fc" cx="336" cy="198" r="23"></circle>
<path class="icw" d="M 336,195 L 331,208 M 336,195 L 341,208 M 333,203 H 339 M 330,186 A 8 8 0 0 0 330,198 M 342,186 A 8 8 0 0 1 342,198"></path><circle class="fw" cx="336" cy="192" r="2.4"></circle></g>
<g class="br" style="animation-delay:calc(var(--k,1) * -1.6s)"><circle class="fv" cx="204" cy="334" r="23"></circle>
<path class="icw" d="M 197,327 H 211 V 341 H 197 Z M 202,332 H 206 V 336 H 202 Z M 201,327 V 323 M 204,327 V 323 M 207,327 V 323 M 201,341 V 345 M 204,341 V 345 M 207,341 V 345 M 197,330 H 193 M 197,334 H 193 M 197,338 H 193 M 211,330 H 215 M 211,334 H 215 M 211,338 H 215"></path></g>
<g class="br" style="animation-delay:calc(var(--k,1) * -2.4s)"><circle class="fc" cx="66" cy="196" r="23"></circle>
<path class="icw" d="M 66,209 C 59,201 57,197 57,192 A 9 9 0 0 1 75,192 C 75,197 73,201 66,209 Z M 62,191 L 70,189 L 66,196 Z"></path></g>
<g class="br" style="animation-duration:calc(var(--k,1) * 4s)"><circle class="fc" cx="200" cy="200" r="33"></circle>
<path class="icw" style="stroke-width:2.6px" d="M 200,186 V 211 M 193,211 H 207 M 187,192 H 213 M 187,192 L 183,202 M 187,192 L 191,202 M 182,202 H 192 M 213,192 L 209,202 M 213,192 L 217,202 M 208,202 H 218"></path><circle class="fw" cx="200" cy="186" r="2.2"></circle></g>
</svg>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">


</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","default":1,"min":0.25,"max":3,"step":0.05,"unit":"×","section":"Motion"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Math.max(0.25, Number(this.props.speed ?? 1));
    const dark = !!(this.props.dark ?? false);
    return {
      k: (1 / s).toFixed(3),
      bg: dark ? '#14121C' : '#FFFFFF',
      ink: dark ? '#F6F3EE' : '#1B1830',
      muted: dark ? '#B9B4CC' : '#5E5A72',
      coral: '#F04A2B',
      violet: dark ? '#8C78FF' : '#5534E0'
    };
  }
}
</script>
</body>
</html>
