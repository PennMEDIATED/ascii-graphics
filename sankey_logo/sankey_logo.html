<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon Sankey mark</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&amp;family=Montserrat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
.fc{fill:var(--c,#F04A2B)} .fv{fill:var(--v,#5534E0)} .fw{fill:#fff} .fbg{fill:var(--bg,#fff)}
.sc{stroke:var(--c,#F04A2B)} .sv{stroke:var(--v,#5534E0)}
.icw{fill:none;stroke:#fff;stroke-width:2.2px;stroke-linecap:round;stroke-linejoin:round}
.icv{fill:none;stroke:var(--v,#5534E0);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#fff;stroke-width:3px;stroke-linecap:round;stroke-dasharray:1 16;animation:flow calc(var(--k,1) * 1.5s) linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.rib{animation:breathe calc(var(--k,1) * 4s) ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.72}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob calc(var(--k,1) * 3s) ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin calc(var(--k,1) * 10s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.mark *{animation:none !important}}
</style>
</helmet>
<div style="width:520px;height:560px;box-sizing:border-box;padding:44px 40px 40px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:{{bg}};--k:{{k}};--c:{{coral}};--v:{{violet}};--bg:{{bg}}">
<svg class="mark" viewBox="0 0 400 400" width="360" height="360" role="img" aria-label="News media, technology and public conversation flow through a mediating layer into democracy and government">
<path class="rib fc" d="M 50,70 C 130,70 120,140 190,140 L 190,180 C 120,180 130,110 50,110 Z"></path>
<path class="rib fv" style="animation-delay:calc(var(--k,1) * -1.3s)" d="M 50,180 C 130,180 120,180 190,180 L 190,220 C 120,220 130,220 50,220 Z"></path>
<path class="rib fc" style="fill-opacity:.55;animation-delay:calc(var(--k,1) * -2.6s)" d="M 50,290 C 130,290 120,220 190,220 L 190,260 C 120,260 130,330 50,330 Z"></path>
<path class="rib fc" style="fill-opacity:.85;animation-delay:calc(var(--k,1) * -0.7s)" d="M 210,140 C 280,140 270,80 350,80 L 350,140 C 270,140 280,200 210,200 Z"></path>
<path class="rib fv" style="fill-opacity:.85;animation-delay:calc(var(--k,1) * -2s)" d="M 210,200 C 280,200 270,260 350,260 L 350,320 C 270,320 280,260 210,260 Z"></path>
<path class="flow" d="M 50,90 C 130,90 120,160 190,160 L 210,160 C 280,160 270,105 350,105"></path>
<path class="flow" style="animation-delay:calc(var(--k,1) * -0.4s)" d="M 50,200 C 130,200 120,190 190,190 L 210,190 C 280,190 270,120 350,120"></path>
<path class="flow" style="animation-delay:calc(var(--k,1) * -0.8s)" d="M 50,200 C 130,200 120,210 190,210 L 210,210 C 280,210 270,280 350,280"></path>
<path class="flow" style="animation-delay:calc(var(--k,1) * -1.1s)" d="M 50,310 C 130,310 120,240 190,240 L 210,240 C 280,240 270,300 350,300"></path>
<rect class="fv" x="188" y="132" width="24" height="136" rx="8"></rect>



<g class="bob"><circle class="fc" cx="50" cy="90" r="28"></circle>
<path class="icw" d="M 39,81 H 61 V 99 H 39 Z M 43,86 H 50 M 43,90 H 57 M 43,94 H 57"></path><rect class="fw" x="53" y="84" width="5" height="4"></rect></g>
<g class="bob" style="animation-delay:calc(var(--k,1) * -1s)"><circle class="fv" cx="50" cy="200" r="28"></circle>
<path class="icw" d="M 42,192 H 58 V 208 H 42 Z M 47,197 H 53 V 203 H 47 Z M 46,192 V 188 M 50,192 V 188 M 54,192 V 188 M 46,208 V 212 M 50,208 V 212 M 54,208 V 212 M 42,196 H 38 M 42,200 H 38 M 42,204 H 38 M 58,196 H 62 M 58,200 H 62 M 58,204 H 62"></path></g>
<g class="bob" style="animation-delay:calc(var(--k,1) * -2s)"><circle class="fc" cx="50" cy="310" r="28"></circle>
<path class="icw" d="M 39,301 H 61 V 314 H 50 L 44,320 V 314 H 39 Z"></path><circle class="fw" cx="44" cy="307.5" r="1.7"></circle><circle class="fw" cx="50" cy="307.5" r="1.7"></circle><circle class="fw" cx="56" cy="307.5" r="1.7"></circle></g>
<g class="bob" style="animation-delay:calc(var(--k,1) * -0.5s)"><circle class="fc" cx="350" cy="110" r="30"></circle>
<path class="icw" d="M 339,106 H 361 V 121 H 339 Z M 345,106 V 97 H 355 V 106 M 347.5,101.5 L 349.5,103.5 L 353,100"></path></g>
<g class="bob" style="animation-delay:calc(var(--k,1) * -1.5s)"><circle class="fv" cx="350" cy="290" r="30"></circle>
<path class="icw" d="M 350,279 V 300 M 344,300 H 356 M 339,284 H 361 M 339,284 L 335.5,293 M 339,284 L 342.5,293 M 335,293 H 343 M 361,284 L 357.5,293 M 361,284 L 364.5,293 M 357,293 H 365"></path></g>
</svg>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">


</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","default":1,"min":0.25,"max":3,"step":0.05,"unit":"×","section":"Motion"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Math.max(0.25, Number(this.props.speed ?? 1));
    const dark = !!(this.props.dark ?? false);
    return {
      k: (1 / s).toFixed(3),
      bg: dark ? '#14121C' : '#FFFFFF',
      ink: dark ? '#F6F3EE' : '#1B1830',
      muted: dark ? '#B9B4CC' : '#5E5A72',
      coral: '#F04A2B',
      violet: dark ? '#8C78FF' : '#5534E0'
    };
  }
}
</script>
</body>
</html>
