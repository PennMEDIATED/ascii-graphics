<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon mosaic mark</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&amp;family=Montserrat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:520px;height:560px;box-sizing:border-box;padding:36px 40px 40px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:{{bg}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; justify-content: center">
<div role="img" aria-label="A five by five grid of icon tiles. M is spelled with media icons, T with technology icons, D with democracy icons, then every tile lights up with all three pillars together" style="position:relative;width:332px;height:332px">
<sc-for list="{{tiles}}" as="c" hint-placeholder-count="25">
<div style="position:absolute;left:{{c.left}}px;top:{{c.top}}px;width:60px;height:60px;box-sizing:border-box;border-radius:10px;transform:scaleX({{c.sx}});background:{{c.fill}};border:2px solid {{c.line}};display:flex;align-items:center;justify-content:center">
<svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true" style="opacity:{{c.iop}}"><path d="{{c.icon}}" fill="none" stroke="{{c.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</sc-for>
</div>

</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","default":1,"min":0.25,"max":3,"step":0.05,"unit":"×","section":"Motion"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._t = 0; this._last = null; this._acc = 0;
    if (typeof window === 'undefined' || !window.requestAnimationFrame) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { this.setState({ t: 12.5 }); return; }
    const loop = (ts) => {
      if (this._last == null) this._last = ts;
      const dt = Math.min(64, ts - this._last);
      this._last = ts;
      this._t += (dt / 1000) * Math.max(0.25, Number(this.props.speed ?? 1));
      this._acc += dt;
      if (this._acc >= 33) { this._acc = 0; this.setState({ t: this._t }); }
      this._raf = window.requestAnimationFrame(loop);
    };
    this._raf = window.requestAnimationFrame(loop);
  }
  componentWillUnmount() {
    if (this._raf && typeof window !== 'undefined') window.cancelAnimationFrame(this._raf);
  }
  renderVals() {
    const dark = !!(this.props.dark ?? false);
    const bg = dark ? '#14121C' : '#FFFFFF';
    const ink = dark ? '#F6F3EE' : '#1B1830';
    const col = { M: '#F04A2B', T: dark ? '#8C78FF' : '#5534E0', D: dark ? '#C26AB0' : '#A23F8E' };
    const rule = dark ? '#3A3550' : '#E3DFEC';
    const faint = dark ? '#6E6890' : '#9C97B3';
    const IC = {
      M: [
        'M4 5h12v14H4z M16 8h4v9a2 2 0 0 1-2 2h-2 M7 9h6 M7 12h6 M7 15h4',
        'M4 5h16v11h-9l-5 4v-4H4z M8 10.5h8',
        'M12 11v10 M9 21h6 M8.5 7.5a5 5 0 0 0 0 7 M15.5 7.5a5 5 0 0 1 0 7 M5.5 4.5a9 9 0 0 0 0 13 M18.5 4.5a9 9 0 0 1 0 13',
        'M9 3h6v10H9z M6 11a6 6 0 0 0 12 0 M12 17v4 M9 21h6',
        'M3 5h18v12H3z M10 8.5l5 2.5-5 2.5z M9 21h6 M12 17v4'
      ],
      T: [
        'M7 7h10v10H7z M10 10h4v4h-4z M10 4v3 M14 4v3 M10 17v3 M14 17v3 M4 10h3 M4 14h3 M17 10h3 M17 14h3',
        'M6 18L12 6l6 12z M4 18a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M10 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M16 18a2 2 0 1 0 4 0a2 2 0 1 0-4 0',
        'M9 7l-5 5 5 5 M15 7l5 5-5 5 M13.5 5l-3 14',
        'M3 9.5a13 13 0 0 1 18 0 M6.5 13a8 8 0 0 1 11 0 M10 16.5a3 3 0 0 1 4 0 M12 20h.01',
        'M5 4l13 7-6 1.5-3 6.5z'
      ],
      D: [
        'M4 12h16v9H4z M8 12V4h8v8 M10 8l1.5 1.5L14.5 6.5',
        'M12 4v16 M8 20h8 M5 7h14 M5 7l-3 7h6z M19 7l-3 7h6z',
        'M3 20h18 M5 20v-7 M9 20v-7 M15 20v-7 M19 20v-7 M3 13h18 M6 13a6 6 0 0 1 12 0 M12 4v3',
        'M8 11a3 3 0 1 0 0-6a3 3 0 1 0 0 6 M2.5 20a5.5 5.5 0 0 1 11 0 M16 11a3 3 0 1 0 0-6 M17 14.5a5.5 5.5 0 0 1 4.5 5.5',
        'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M8.5 12l2.5 2.5 4.5-5'
      ]
    };
    const F = {
      M: ['10001', '11011', '10101', '10001', '10001'],
      T: ['11111', '00100', '00100', '00100', '00100'],
      D: ['11110', '10001', '10001', '10001', '11110']
    };
    const P = ['M', 'T', 'D'];
    const state = (phase, r, c) => {
      const i = r * 5 + c;
      if (phase === 'ALL') { const p = P[(r + 2 * c) % 3]; return { on: true, p, icon: IC[p][(i * 3) % 5] }; }
      const on = F[phase][r][c] === '1';
      const p = on ? phase : P[(r + c + 1) % 3];
      return { on, p, icon: IC[p][(i * 2 + r) % 5] };
    };
    const t = (this.state && this.state.t) || 0;
    const seq = ['M', 'T', 'D', 'ALL'];
    const SEG = 3.4, k = Math.floor(t / SEG) % 4, local = t % SEG;
    const cur = seq[k], prev = seq[(k + 3) % 4];
    const tiles = [];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const a = state(prev, r, c), b = state(cur, r, c);
        const u = Math.max(0, Math.min(1, (local - (r + c) * 0.08) / 0.5));
        const same = a.on === b.on && a.p === b.p && a.icon === b.icon;
        const sx = same ? 1 : Math.abs(Math.cos(Math.PI * u));
        const s = u < 0.5 ? a : b;
        tiles.push({
          left: c * 68, top: r * 68,
          sx: Math.max(0.04, sx).toFixed(3),
          fill: s.on ? col[s.p] : bg,
          line: s.on ? col[s.p] : rule,
          stroke: s.on ? '#FFFFFF' : faint,
          iop: s.on ? '1' : '0.45',
          icon: s.icon
        });
      }
    }
    const caps = { M: 'Media', T: 'Technology', D: 'Democracy', ALL: 'Media · Technology · Democracy' };
    const cu = Math.max(0, Math.min(1, local / 0.6));
    return {
      tiles, bg, ink,
      caption: caps[cur],
      capCol: cur === 'ALL' ? ink : col[cur],
      capOp: cu.toFixed(2)
    };
  }
}
</script>
</body>
</html>
