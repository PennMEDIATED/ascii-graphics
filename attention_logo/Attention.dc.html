<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attention mark</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&amp;family=DM+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:520px;height:560px;box-sizing:border-box;padding:44px 40px 40px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:{{bg}}">
<div role="img" aria-label="The letters of MEDIATED as tokens, with attention arcs between them; each letter in turn lights up and its strongest connections thicken, the way a language model reads, with M, T and D attending most to each other" style="position:relative;width:440px;height:330px">
<sc-for list="{{arcs}}" as="a" hint-placeholder-count="15">
<svg style="position:absolute;left:0;top:0" width="440" height="330" viewBox="0 0 440 330" aria-hidden="true"><path d="{{a.d}}" fill="none" stroke="{{a.col}}" stroke-width="{{a.w}}" stroke-opacity="{{a.op}}" stroke-linecap="round"></path></svg>
</sc-for>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
<div style="position:absolute;left:{{c.x}}px;top:244px;width:{{c.w}}px;height:42px;box-sizing:border-box;border-radius:9px;border:2px solid {{c.line}};background:{{c.fill}};display:flex;align-items:center;justify-content:center;font-family:'DM Sans',system-ui,sans-serif;font-size:21px;font-weight:700;color:{{c.txt}}">{{c.word}}</div>
</sc-for>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
<div style="position:absolute;left:{{b.x}}px;top:294px;width:{{b.w}}px;height:{{b.h}}px;border-radius:2px;background:{{b.col}}"></div>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">


</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","default":1,"min":0.25,"max":3,"step":0.05,"unit":"×","section":"Motion"},"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._t = 0; this._last = null; this._acc = 0;
    if (typeof window === 'undefined' || !window.requestAnimationFrame) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { this.setState({ t: 1.2 }); return; }
    const loop = (ts) => {
      if (this._last == null) this._last = ts;
      const dt = Math.min(64, ts - this._last);
      this._last = ts;
      this._t += (dt / 1000) * Math.max(0.25, Number(this.props.speed ?? 1));
      this._acc += dt;
      if (this._acc >= 33) { this._acc = 0; this.setState({ t: this._t }); }
      this._raf = window.requestAnimationFrame(loop);
    };
    this._raf = window.requestAnimationFrame(loop);
  }
  componentWillUnmount() {
    if (this._raf && typeof window !== 'undefined') window.cancelAnimationFrame(this._raf);
  }
  renderVals() {
    const dark = !!(this.props.dark ?? false);
    const coral = '#F04A2B';
    const violet = dark ? '#8C78FF' : '#5534E0';
    const bg = dark ? '#14121C' : '#FFFFFF';
    const ink = dark ? '#F6F3EE' : '#1B1830';
    const rule = dark ? '#3A3550' : '#DCD7E8';
    const t = (this.state && this.state.t) || 0;
    const ss = (x) => { const v = Math.max(0, Math.min(1, x)); return v * v * (3 - 2 * v); };
    const words = ['M', 'E', 'D', 'I', 'A', 'T', 'E', 'D'];
    const N = words.length;
    const W = [
      [0, 0.05, 0.05, 0.03, 0.03, 0.45, 0.04, 0.35],
      [0.15, 0, 0.10, 0.05, 0.05, 0.10, 0.45, 0.10],
      [0.15, 0.05, 0, 0.10, 0.05, 0.10, 0.05, 0.50],
      [0.10, 0.10, 0.15, 0, 0.35, 0.15, 0.05, 0.10],
      [0.10, 0.05, 0.10, 0.40, 0, 0.25, 0.05, 0.05],
      [0.40, 0.03, 0.05, 0.05, 0.07, 0, 0.05, 0.35],
      [0.05, 0.50, 0.05, 0.05, 0.05, 0.15, 0, 0.15],
      [0.40, 0.05, 0.15, 0.03, 0.02, 0.35, 0, 0]
    ];
    const widths = words.map(() => 44);
    const total = widths.reduce((s, w) => s + w, 0) + 8 * (N - 1);
    let x = (440 - total) / 2;
    const pos = widths.map((w) => { const p = { x, w, cx: x + w / 2 }; x += w + 8; return p; });
    const SEG = 1.7, f = Math.floor(t / SEG) % N, pf = (f + N - 1) % N;
    const u = ss((t % SEG) / 0.6);
    const att = (focus, i, j) => (i === focus ? W[focus][j] : j === focus ? W[focus][i] : 0);
    const arcs = [];
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const w = att(pf, i, j) * (1 - u) + att(f, i, j) * u;
        const x1 = pos[i].cx, x2 = pos[j].cx, h = 24 + 0.58 * (x2 - x1);
        arcs.push({
          d: 'M ' + x1.toFixed(1) + ',240 C ' + x1.toFixed(1) + ',' + (240 - h).toFixed(1) + ' ' + x2.toFixed(1) + ',' + (240 - h).toFixed(1) + ' ' + x2.toFixed(1) + ',240',
          w: (1.2 + 11 * w).toFixed(2),
          op: (0.1 + 0.9 * Math.min(1, w * 1.8)).toFixed(2),
          col: w > 0.35 ? coral : violet
        });
      }
    }
    const chips = words.map((word, i) => {
      const isF = i === (u > 0.5 ? f : pf);
      const recv = i === f ? 0 : W[f][i] * u + (i === pf ? 0 : W[pf][i]) * (1 - u);
      return {
        word, x: pos[i].x.toFixed(1), w: pos[i].w.toFixed(1),
        fill: isF ? coral : bg,
        line: isF ? coral : recv > 0.35 ? violet : rule,
        txt: isF ? '#FFFFFF' : ink
      };
    });
    const bars = words.map((word, i) => {
      const v = i === f ? 0 : W[f][i];
      return { x: (pos[i].x + 4).toFixed(1), w: (pos[i].w - 8).toFixed(1), h: (3 + 30 * v * u).toFixed(1), col: v > 0.35 ? coral : violet };
    });
    return {
      arcs, chips, bars, bg, ink,
      muted: dark ? '#B9B4CC' : '#5E5A72'
    };
  }
}
</script>
</body>
</html>
